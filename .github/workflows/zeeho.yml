name: ZEEHO Auto Gy

on:
  workflow_dispatch:
  schedule:
    # GitHub cron 使用 UTC；02:00 UTC = 北京时间 10:00
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: zeeho-auto-gy
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      ZEEHO_TOKEN: ${{ secrets.ZEEHO_TOKEN }}
      ZEEHO_USER_ID: ${{ secrets.ZEEHO_USER_ID }}
      ZEEHO_USER_NAME: ${{ secrets.ZEEHO_USER_NAME }}
      ZEEHO_USER_AGENT: ${{ secrets.ZEEHO_USER_AGENT }}

    steps:
      - name: 检查 Secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZEEHO_TOKEN" || { echo "::error::缺少 ZEEHO_TOKEN"; exit 1; }
          test -n "$ZEEHO_USER_ID" || { echo "::error::缺少 ZEEHO_USER_ID"; exit 1; }

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 准备运行环境
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          cd run
          npm init -y >/dev/null
          npm install --no-audit --no-fund got@11 tough-cookie@4 iconv-lite@0.6

          curl --fail --location --retry 3             "https://raw.githubusercontent.com/cluck798/ZEEHO/a73a500856e22de8aa56bf98d59aff2dc0d2a84d/script/zeeho.js"             -o zeeho.js

          cat > sendNotify.js <<'EOF'
          module.exports = {
            sendNotify: async (title, body) => {
              console.log("\n========== ZEEHO 运行汇总 ==========");
              console.log(title || "");
              console.log(body || "");
              console.log("====================================\n");
            }
          };
          EOF

      - name: 生成本次账号配置
        shell: bash
        run: |
          set -euo pipefail
          cd run
          node - <<'NODE'
          const fs = require("fs");
          const token = (process.env.ZEEHO_TOKEN || "").replace(/^[Bb]earer\s+/,"").trim();
          const userId = (process.env.ZEEHO_USER_ID || "").trim();
          const userName = (process.env.ZEEHO_USER_NAME || "Gy").trim();
          const userAgent = (process.env.ZEEHO_USER_AGENT || "okhttp/4.12.0").trim();

          if (!token || !userId) throw new Error("ZEEHO_TOKEN / ZEEHO_USER_ID 不能为空");

          const data = [{ token, userId, userName, userAgent }];
          fs.writeFileSync("account.json", JSON.stringify(data));
          NODE

      - name: 执行签到 + 积分任务 + 盲盒
        shell: bash
        run: |
          set -euo pipefail
          cd run
          export zeeho_data="$(cat account.json)"
          rm -f account.json
          node zeeho.js 2>&1 | tee zeeho.log

      - name: 生成邮件明细
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          cd run
          {
            echo "ZEEHO 自动任务执行成功"
            echo
            echo "执行时间（北京时间）：$(date '+%Y-%m-%d %H:%M:%S')"
            echo
            echo "----- 任务明细 -----"
            grep -E "签到任务|连续签到|创建动态|点赞动态|评论动态|分享动态|分享积分|删除动态|今日获得|共[0-9]+个账号|积分:" zeeho.log || cat zeeho.log
          } > mail.txt

      - name: 成功后发送邮件明细
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "ZEEHO 每日任务成功 - ${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: "ZEEHO Auto Gy"
          body: file://run/mail.txt
