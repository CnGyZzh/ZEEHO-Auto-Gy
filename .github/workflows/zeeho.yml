name: ZEEHO Auto Gy

on:
  workflow_dispatch:
  # 临时触发一次更新后实测；验证结束后移除 push，保持只在定时/手动时运行。
  push:
    branches: [main]
    paths: [".github/workflows/zeeho.yml"]
  schedule:
    # 北京时间每天中午 12:07 主签到，12:37 兜底。
    # GitHub Actions 采用 UTC：04:07 / 04:37 UTC = 12:07 / 12:37 CST (UTC+8)。
    # 定时调度可能延迟；同日真实签到成功后，兜底任务自动跳过。
    - cron: "7 4 * * *"
    - cron: "37 4 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: zeeho-auto-gy
  cancel-in-progress: false

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      ZEEHO_TOKEN: ${{ secrets.ZEEHO_TOKEN }}
      ZEEHO_USER_ID: ${{ secrets.ZEEHO_USER_ID }}
      ZEEHO_USER_NAME: ${{ secrets.ZEEHO_USER_NAME }}
      ZEEHO_USER_AGENT: ${{ secrets.ZEEHO_USER_AGENT }}

    steps:
      - name: 判断今天是否已有真实签到成功
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "run=true" >> "$GITHUB_OUTPUT"

          # 手动执行始终允许运行，便于修复后主动验证。
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "手动任务：执行签到校验。"
            exit 0
          fi

          TODAY="$(TZ=Asia/Shanghai date +%F)"
          # 仅信任同一工作流代码提交的成功执行；旧版误报成功的运行不会误拦截。
          # GitHub Actions 的 success 仅在下方签到验证通过时才成立。
          SUCCESS_COUNT="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/zeeho.yml/runs?status=success&per_page=100" \
              | jq --arg today "$TODAY" --arg sha "$GITHUB_SHA" '
                  [.workflow_runs[]
                    | select(.head_sha == $sha)
                    | select(.event == "schedule" or .event == "workflow_dispatch")
                    | select(.run_started_at != null)
                    | select((.run_started_at | fromdateiso8601 + 28800 | strftime("%Y-%m-%d")) == $today)
                  ] | length'
          )"
          if [ "$SUCCESS_COUNT" -gt 0 ]; then
            echo "北京时间 $TODAY 已有核验通过的签到，跳过本次兜底。"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "北京时间 $TODAY 未发现核验通过的签到，开始执行。"
          fi

      - name: 检查 Secrets
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ZEEHO_TOKEN" || { echo "::error::缺少 ZEEHO_TOKEN"; exit 1; }
          test -n "$ZEEHO_USER_ID" || { echo "::error::缺少 ZEEHO_USER_ID"; exit 1; }

      - name: 安装 Node.js
        if: steps.guard.outputs.run == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: 准备运行环境
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run
          cd run
          npm init -y >/dev/null
          npm install --no-audit --no-fund got@11 tough-cookie@4 iconv-lite@0.6

          curl --fail --location --retry 3             "https://raw.githubusercontent.com/cluck798/ZEEHO/3b587a80650e34f6c4eab9f9414468e2ac8cbf21/script/zeeho.js"             -o zeeho.js

          cat > sendNotify.js <<'EOF'
          module.exports = {
            sendNotify: async (title, body) => {
              console.log("\n========== ZEEHO 运行汇总 ==========");
              console.log(title || "");
              console.log(body || "");
              console.log("====================================\n");
            }
          };
          EOF

      - name: 生成本次账号配置
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd run
          node - <<'NODE'
          const fs = require("fs");
          const token = (process.env.ZEEHO_TOKEN || "").replace(/^[Bb]earer\s+/,"").trim();
          const userId = (process.env.ZEEHO_USER_ID || "").trim();
          const userName = (process.env.ZEEHO_USER_NAME || "Gy").trim();
          const userAgent = (process.env.ZEEHO_USER_AGENT || "okhttp/4.12.0").trim();

          if (!token || !userId) throw new Error("ZEEHO_TOKEN / ZEEHO_USER_ID 不能为空");

          const data = [{ token, userId, userName, userAgent }];
          fs.writeFileSync("account.json", JSON.stringify(data));
          NODE

      - name: 执行签到 + 积分任务 + 盲盒
        id: execute
        if: steps.guard.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd run
          export zeeho_data="$(cat account.json)"
          rm -f account.json
          # 上游脚本在收到 401 后仍会继续调用其他接口；首个 401 立即中止，
          # 避免失效凭证重复请求及将“账号执行成功”误认为“签到成功”。
          python3 - <<'PY'
          import os
          import re
          import subprocess
          import sys

          token = os.environ.get("ZEEHO_TOKEN", "").strip()
          user_id = os.environ.get("ZEEHO_USER_ID", "").strip()
          unauthorized = False
          process = subprocess.Popen(
              ["node", "zeeho.js"],
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              encoding="utf-8",
              errors="replace",
              bufsize=1,
          )

          with open("zeeho.log", "w", encoding="utf-8") as log:
              for line in process.stdout:
                  safe = line
                  for sensitive in (token, re.sub(r"(?i)^bearer\\s+", "", token), user_id):
                      if sensitive:
                          safe = safe.replace(sensitive, "[REDACTED]")
                  safe = re.sub(r"(?i)(bearer\\s+)[a-z0-9._=-]+", r"\\1[REDACTED]", safe)
                  print(safe, end="", flush=True)
                  log.write(safe)
                  log.flush()
                  if re.search(r"Response code 401|401\\s*\\(Unauthorized\\)|\\bUnauthorized\\b", line, re.I):
                      unauthorized = True
                      process.terminate()
                      break

          try:
              exit_code = process.wait(timeout=8)
          except subprocess.TimeoutExpired:
              process.kill()
              exit_code = process.wait()

          if unauthorized:
              print("::error::ZEEHO HTTP 401：当前授权无效或接口校验不通过；已停止后续操作，请安全更新仓库 Secret ZEEHO_TOKEN。")
              sys.exit(86)
          if exit_code != 0:
              print("::error::ZEEHO 上游脚本非正常退出。")
              sys.exit(exit_code if exit_code > 0 else 1)
          PY

      - name: 核验真实签到并生成安全报告
        id: verify
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        shell: bash
        env:
          EXECUTION_OUTCOME: ${{ steps.execute.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p run
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          log_file = Path("run/zeeho.log")
          log = log_file.read_text(encoding="utf-8", errors="replace") if log_file.is_file() else ""
          # 禁止将上游原始日志（可能包含身份信息）复制进通知邮件。
          sign = re.search(r"签到任务:\s*(签到成功(?:\s*\+\s*\d+积分)?|今日已签到)", log)
          streak = re.search(r"连续签到\s*(\d+)\s*天", log)
          summary = re.search(r"共\s*(\d+)\s*个账号[,，]\s*成功\s*(\d+)\s*个[,，]\s*失败\s*(\d+)\s*个", log)
          gain = re.search(r"今日获得:\s*签到(\d+)\s*\+\s*盲盒(\d+)\s*\+\s*互动(\d+)\s*=\s*共(\d+)分", log)
          http_401 = bool(re.search(r"Response code 401|401\s*\(Unauthorized\)|\bUnauthorized\b", log, re.I))
          sign_failed = bool(re.search(r"(?:⛔️?\s*签到任务:|⛔️?\s*签到失败!|❌\s*签到任务:)", log))
          streak_days = int(streak.group(1)) if streak else 0
          summary_ok = bool(summary and int(summary.group(1)) == 1 and int(summary.group(2)) == 1 and int(summary.group(3)) == 0)
          passed = (os.getenv("EXECUTION_OUTCOME") == "success" and
                    bool(sign) and streak_days > 0 and summary_ok and
                    not http_401 and not sign_failed)

          reasons = []
          if os.getenv("EXECUTION_OUTCOME") != "success":
              reasons.append("脚本执行未正常完成")
          if not sign:
              reasons.append("未确认签到成功或今日已签到")
          if streak_days < 1:
              reasons.append("连续签到记录未能验证")
          if not summary_ok:
              reasons.append("账号执行汇总不符合预期")
          if http_401:
              reasons.append("发现 HTTP 401 未授权响应")
          if sign_failed:
              reasons.append("签到接口报告失败")

          lines = [
              "ZEEHO 每日任务：" + ("签到成功（已核验）" if passed else "签到失败 / 待排查"),
              "执行结果：" + ("成功" if passed else "失败"),
              "北京时间：" + __import__("datetime").datetime.now(__import__("datetime").timezone(__import__("datetime").timedelta(hours=8))).strftime("%Y-%m-%d %H:%M:%S"),
              "运行链接：" + os.getenv("RUN_URL", ""),
          ]
          if sign:
              lines.append("签到状态：" + sign.group(1))
          if streak:
              lines.append("连续签到：" + str(streak_days) + " 天")
          if summary:
              lines.append("账号汇总：" + summary.group(1) + " 个账号 / 成功 " + summary.group(2) + " / 失败 " + summary.group(3))
          if gain:
              lines.append("积分统计：签到 " + gain.group(1) + " / 盲盒 " + gain.group(2) + " / 互动 " + gain.group(3) + " / 合计 " + gain.group(4))
          if reasons:
              lines.append("异常原因：" + "；".join(reasons))
          Path("run/mail.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("ZEEHO 签到核验：" + ("通过" if passed else "未通过"))
          for reason in reasons:
              print("核验异常：" + reason)
          sys.exit(0 if passed else 1)
          PY

      - name: 发送签到结果邮件（成功和失败均通知）
        if: ${{ always() && steps.guard.outputs.run == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "ZEEHO 每日签到${{ steps.verify.outcome == 'success' && '成功' || '失败' }} - ${{ github.run_number }}"
          to: ${{ secrets.MAIL_TO }}
          from: "ZEEHO Auto Gy"
          body: file://run/mail.txt
